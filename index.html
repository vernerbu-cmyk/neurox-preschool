<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3f8a">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icons/squirrel-192.png">
<title>NeuroX · Подготовка к школе</title>
<style>
:root{--blue:#1e3f8a;--orange:#ff6a00;--ink:#263b5e;--paper:#fffcf5;--line:#e8edf2}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fffaf0;color:var(--ink);font-family:'Nunito Sans','Trebuchet MS','Comfortaa',Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.top{height:64px;background:var(--blue);position:relative;color:white}
.top::after{content:'';position:absolute;bottom:-8px;left:0;right:0;height:14px;background:radial-gradient(19px 10px at 20px 0,var(--blue) 96%,transparent 103%) repeat-x;background-size:40px 14px;pointer-events:none}
.top-in{max-width:1100px;padding:0 30px;margin:auto;height:100%;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:25px;letter-spacing:-1.5px;font-weight:1000;display:flex;align-items:center;gap:2px}
.logo .x{color:#ffb028;transform:rotate(-8deg);display:inline-block}
.top-cap{font-size:12px;letter-spacing:.07em;font-weight:900;color:#d8e7ff}
main{max-width:1100px;margin:auto;padding:24px 30px 50px}
.hello{background:#fff4d8;border:1px solid #ffe4ac;min-height:144px;border-radius:27px;position:relative;display:flex;align-items:center;padding:19px 28px 18px;margin:6px 0 27px;overflow:hidden}
.hello::before{content:'';width:185px;height:185px;border:3px dashed #ffe2a2;border-radius:50%;position:absolute;right:120px;bottom:-120px}
.hello::after{content:'';width:15px;height:15px;background:#ffc163;border-radius:50%;position:absolute;right:170px;top:22px}
.hello-copy{z-index:1;position:relative;max-width:70%}
.eyebrow{font-size:13px;font-weight:900;color:#ca792e;letter-spacing:.035em;margin-bottom:7px}
h1{font-family:Comfortaa,'Trebuchet MS',sans-serif;font-size:clamp(27px,3.6vw,37px);line-height:1.25;letter-spacing:-1.1px;margin:0;color:var(--blue);font-weight:900}
.hello p{margin:8px 0 0;font-size:15px;font-weight:750;color:#73604b}
.squirrel{height:150px;width:152px;position:absolute;bottom:-6px;right:38px;transform:rotate(1deg)}
.label-head{margin:0 0 13px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h2{font-family:Comfortaa,'Trebuchet MS',sans-serif;color:var(--blue);font-size:19px;line-height:1.3;letter-spacing:-.55px;margin:0;font-weight:900}
.hint{font-size:13px;color:#7b8aa0;font-weight:800}
.worlds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:29px}
.world{display:flex;align-items:center;gap:10px;padding:12px 13px;text-align:left;min-height:82px;border:2px solid transparent;border-radius:21px;background:var(--shade);color:var(--blue);transition:transform .12s,box-shadow .12s,border-color .12s}
.world:hover{transform:translateY(-2px)}
.world[aria-pressed="true"]{border-color:var(--active);box-shadow:0 4px 0 var(--active),0 8px 16px #293d5d0d}
.world .wi{height:48px;width:48px;flex-shrink:0;display:grid;place-items:center;background:white;border-radius:15px;box-shadow:0 2px 0 #2745630d}
.world .wi svg{width:37px;height:37px;overflow:visible}
.world .wt{display:flex;flex-direction:column;gap:4px;min-width:0}
.world strong{font-size:14px;line-height:1.22;font-weight:900}
.world small{font-size:12px;font-weight:800;color:#62728a}
.world.read{--shade:#fff0ce;--active:#ffb22f}
.world.math{--shade:#e1f8eb;--active:#48c290}
.world.logic{--shade:#e3f0ff;--active:#65aaf6}
.world.memory{--shade:#ffe5dc;--active:#ff9e7f}
.games-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}
.game-title{display:flex;align-items:center;gap:10px}
.tiny-orb{display:block;width:13px;height:13px;border-radius:50%;background:var(--active);box-shadow:0 0 0 5px var(--shade)}
.games-head .count{color:#8191a5;font-size:13px;font-weight:900}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{display:flex;align-items:stretch;flex-direction:column;position:relative;background:#fff;border:2px solid #eff0ed;border-radius:23px;min-height:202px;overflow:hidden;padding:0;box-shadow:0 5px 0 #dfdfd93a;text-align:center;color:var(--blue);transition:transform .14s,box-shadow .14s}
.card{text-decoration:none;cursor:pointer}.card:hover{transform:translateY(-3px);box-shadow:0 8px 0 #dfdfd93a}
.card:active{transform:translateY(1px)}
.art{height:153px;display:grid;place-items:center;position:relative;overflow:hidden;background:var(--cardbg)}
.art::before{content:'';position:absolute;width:150px;height:150px;border-radius:50%;background:#fff9;left:50%;top:50%;transform:translate(-50%,-50%)}
.art::after{content:'';position:absolute;width:22px;height:22px;border-radius:50%;right:22px;top:14px;background:#fff7}
.art svg{z-index:1;width:min(82%,160px);height:130px;display:block;filter:drop-shadow(0 3px 0 #263b5e0a)}
.cname{font-family:Comfortaa,'Trebuchet MS',sans-serif;display:flex;align-items:center;justify-content:center;flex:1;min-height:64px;padding:11px 9px;font-size:16px;line-height:1.34;font-weight:900;letter-spacing:-.45px}
.card:nth-child(4n + 2) .art::before{border-radius:31% 69% 48% 52%/47% 38% 62% 53%;transform:translate(-50%,-50%) rotate(20deg)}
.card:nth-child(4n + 3) .art::before{border-radius:42% 58% 37% 63%/63% 42% 58% 37%;transform:translate(-50%,-50%) rotate(-20deg)}
.foot{font-size:12px;color:#a0a7ad;text-align:center;margin-top:36px;line-height:1.5;font-weight:750}
.overlay{display:none;position:fixed;inset:0;background:#24365c90;z-index:20;align-items:center;justify-content:center;padding:18px}
.overlay.show{display:flex}
.dialog{width:min(400px,100%);background:#fff;border-radius:26px;padding:28px;text-align:center;box-shadow:0 20px 70px #20315044}
.dialog-icon{height:80px;width:80px;display:grid;place-items:center;background:#fff0ce;border-radius:22px;margin:0 auto 14px}
.dialog-icon svg{width:62px;height:62px}
.dialog h3{font-family:Comfortaa,'Trebuchet MS',sans-serif;font-size:20px;margin:0 0 10px;color:var(--blue)}
.dialog p{font-size:14px;line-height:1.6;color:#64738a;margin:0 0 20px}
.dialog button{padding:13px 25px;background:var(--blue);color:white;border:0;border-radius:14px;font-weight:900}
@media (max-width:800px){.top-in{padding:0 18px}main{padding:21px 18px 45px}.worlds{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.art{height:135px}.art svg{height:116px}.card{min-height:192px}.hello{min-height:142px;margin-bottom:23px}}
@media (max-width:420px){.top{height:56px}.logo{font-size:22px}.top-cap{font-size:11px}main{padding:22px 14px 36px}.hello{min-height:135px;padding:15px 15px;border-radius:23px;margin-bottom:22px}.hello-copy{max-width:70%}.eyebrow{font-size:10px;margin-bottom:6px}h1{font-size:27px}.hello p{font-size:12px;line-height:1.45;max-width:190px}.squirrel{right:-7px;bottom:-9px;height:129px;width:130px}.label-head{margin-bottom:10px}h2{font-size:16px}.hint{font-size:11px}.world{gap:8px;padding:9px 8px;min-height:69px;border-radius:16px}.world .wi{width:42px;height:42px;border-radius:12px}.world .wi svg{width:32px;height:32px}.world strong{font-size:12px}.world small{font-size:11px}.worlds{margin-bottom:24px;gap:9px}.games-head{margin-bottom:12px}.art{height:112px}.art svg{height:100px;width:90%}.art::before{width:110px;height:110px}.cname{min-height:58px;font-size:13px;padding:8px 5px;letter-spacing:-.65px}.card{border-radius:18px;min-height:172px}.cards{gap:10px}.games-head .count{font-size:11px}.foot{margin-top:25px}}
@media(max-width:340px){.squirrel{right:-19px;transform:scale(.9)}.hello-copy{max-width:74%}.world strong{font-size:11px}.world small{font-size:10px}.cname{font-size:12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}

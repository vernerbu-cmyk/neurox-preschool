<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Что лишнее? — NeuroX</title>
<style>
  :root{--picture-atlas:url("../assets/different-illustrations.webp");--blue:#1E3F8A;--blue-soft:#EAF0FF;--orange:#FF6A00;--orange-soft:#FFF3E8;--ink:#202B42;--muted:#617087;--border:#DCE5F1;--bg:#F6F8FC;--green:#238450;--green-bg:#E9F7EF;--warn:#A45118;--warn-bg:#FFF3E9}
  *{box-sizing:border-box}
  html{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
  body{margin:0;background:var(--bg);color:var(--ink);padding:14px 14px 40px;-webkit-tap-highlight-color:transparent}
  button,input{font:inherit}
  button{cursor:pointer}
  button:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
  .wrap{max-width:920px;margin:0 auto}
  .app-head{display:flex;align-items:center;gap:14px;padding:14px 18px;background:white;border:1px solid var(--border);border-radius:20px;margin-bottom:18px;box-shadow:0 4px 14px #12346509}
  .back{border:0;border-radius:12px;background:var(--blue-soft);color:var(--blue);width:44px;height:44px;font-size:25px;font-weight:800;flex:0 0 auto}
  h1{font-size:clamp(21px,4vw,27px);margin:0;color:var(--blue);line-height:1.15}
  .app-head small{display:block;color:var(--muted);font-weight:600;margin-top:4px}
  .panel{background:white;border:1px solid var(--border);border-radius:24px;padding:clamp(16px,3.2vw,28px);box-shadow:0 7px 26px #132E4B0A;margin-bottom:16px}
  h2{font-size:21px;color:var(--blue);margin:0 0 9px}
  .intro{line-height:1.55;color:var(--muted);margin:0 0 16px}
  .section{margin-top:24px}
  .section:first-of-type{margin-top:10px}
  .section-title{font-size:15px;font-weight:800;color:var(--ink);margin:0 0 12px}
  .choices{display:flex;flex-wrap:wrap;gap:8px}
  .choice,.mini,.ghost{border:2px solid var(--border);background:#fff;color:var(--blue);border-radius:13px;font-weight:750;padding:11px 15px;min-height:44px;transition:background .15s,border-color .15s,transform .15s}
  .choice:hover,.mini:hover,.ghost:hover{border-color:var(--orange)}
  .choice.selected{background:var(--blue);color:white;border-color:var(--blue)}
  .choice .count{opacity:.68;font-size:12px;margin-left:5px}
  .mini{padding:7px 12px;min-height:36px;font-size:13px}
  .topic-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:9px;margin-bottom:11px}
  .topic-head .section-title{margin:0}
  .topic-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:9px}
  .topic{display:flex;align-items:center;gap:10px;border:1px solid var(--border);background:#FAFCFF;border-radius:13px;padding:12px;cursor:pointer;font-size:14px;font-weight:700;min-width:0}
  .topic input{width:19px;height:19px;accent-color:var(--blue);flex:0 0 auto}
  .topic-name{flex:1;overflow-wrap:anywhere}
  .topic .count{font-size:12px;color:var(--muted)}
  .option-list{display:grid;gap:10px}
  .option{display:flex;align-items:flex-start;gap:10px;font-size:14px;line-height:1.35;cursor:pointer}
  .option input{width:19px;height:19px;accent-color:var(--blue);margin:1px 0 0;flex:0 0 auto}
  .option small{display:block;color:var(--muted);margin-top:3px}
  .notice{border-radius:14px;background:var(--blue-soft);color:#253E74;padding:12px 14px;font-size:14px;line-height:1.5;margin-top:17px}
  .primary{padding:14px 23px;border:0;background:var(--orange);color:#fff;font-weight:800;font-size:17px;border-radius:14px;min-height:50px}
  .primary:disabled{background:#C6D0DD;cursor:not-allowed}
  .primary:not(:disabled):hover{background:#E85D00}
  .start{width:100%;margin-top:22px}
  .meta{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:14px;font-weight:750;margin-bottom:12px}
  .track{height:9px;background:var(--blue-soft);border-radius:999px;overflow:hidden;margin-bottom:20px}
  .fill{background:var(--orange);height:100%;width:0;transition:width .2s}
  .question{text-align:center;font-weight:850;color:var(--blue);font-size:clamp(20px,4.8vw,26px);line-height:1.25;margin:8px 0 5px}
  .question-sub{text-align:center;color:var(--muted);font-size:14px;line-height:1.4;margin:0 0 22px}
  .game-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:670px;margin:0 auto}
  @media(min-width:690px){.game-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}}
  .item{border:3px solid var(--border);background:#F9FBFF;border-radius:19px;min-height:144px;aspect-ratio:1/1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;padding:9px 5px;transition:border .15s,background .15s,transform .15s;width:100%;color:var(--ink)}
  .item:not(:disabled):hover{border-color:var(--orange);transform:translateY(-2px)}
  .item:disabled{cursor:default;opacity:1}
  .item .picture{width:clamp(76px,17vw,102px);height:clamp(76px,17vw,102px);flex:0 0 auto;display:flex;align-items:center;justify-content:center;background-repeat:no-repeat;background-size:cover}
  .item .picture.illustration{background-image:var(--picture-atlas);background-size:1500% 1800%}
  .item .picture.letter{font-size:clamp(51px,10vw,76px);font-weight:850;color:var(--blue)}
  .item .word{font-size:clamp(12px,2.1vw,15px);font-weight:750;line-height:1.2;text-align:center;overflow-wrap:anywhere;max-width:100%}
  .item.nolabel .word{display:none}
  .item.try-again{border-color:#FF9F5A;background:var(--warn-bg)}
  .item.correct{border-color:var(--green);background:var(--green-bg)}
  .item.intended{border-color:var(--green);background:var(--green-bg)}
  .status{margin:21px auto 0;border-radius:15px;background:var(--blue-soft);padding:14px 16px;max-width:740px;min-height:56px;font-weight:700;line-height:1.5;text-align:center;color:var(--blue)}
  .status.success{background:var(--green-bg);color:var(--green)}
  .status.retry{background:var(--warn-bg);color:var(--warn)}
  .hint{display:block;margin:12px auto 0;max-width:740px;padding:14px;border:1px dashed #D59B55;border-radius:14px;background:#FFF9EF;color:#714111;font-size:15px;line-height:1.45;text-align:center}
  .reason{max-width:740px;margin:12px auto 0;padding:14px 16px;border-left:4px solid var(--orange);border-radius:12px;background:#FFF7F0;line-height:1.5}
  .controls{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:19px}
  .controls .primary{min-width:170px}
  #hintBtn{display:inline-flex;align-items:center;justify-content:center;gap:7px}
  .controls .ghost{min-height:50px}
  .teacher-action{margin:12px auto 0;display:block;border:0;background:transparent;color:var(--blue);text-decoration:underline;font-size:13px;font-weight:750;padding:9px 15px}
  .subtle{font-size:13px;color:var(--muted);margin-top:15px;line-height:1.5;text-align:center}
  .result{text-align:center}
  .result .medal{width:68px;height:68px;margin:10px auto;display:block;color:#EFAD37}
  .result h2{font-size:26px;margin-bottom:15px}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:left;margin:20px auto;max-width:610px}
  .stat{border-radius:15px;padding:15px;background:#F5F8FC;border:1px solid var(--border)}
  .stat strong{display:block;font-size:27px;color:var(--blue);margin-bottom:6px}
  .stat span{color:var(--muted);line-height:1.4;font-size:13px;font-weight:700}
  .result-note{color:var(--muted);line-height:1.55;max-width:650px;margin:14px auto}
  [hidden]{display:none!important}
  @media(max-width:470px){body{padding:9px 9px 24px}.app-head{padding:11px 12px}.item{border-radius:14px;min-height:126px}.topic-list{grid-template-columns:repeat(2,minmax(0,1fr))}.topic{padding:10px 8px;gap:6px;font-size:12.5px}.stat{padding:12px}.stats{gap:8px}.controls .primary{width:100%}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
<link rel="stylesheet" href="../assets/menu-drawer.css">
</head>

<div class="wrap">
  <header class="app-head">
    <button class="back" id="backBtn" aria-label="Вернуться назад" title="Назад">←</button>
    <div><h1 style="display:flex;align-items:center;gap:10px"><svg xmlns="http://www.w3.org/2000/svg" width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#1E3F8A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><span>Что лишнее?</span></h1><small>Замечаем общее, сравниваем и объясняем</small></div>
  </header>
  <main id="game"></main>
</div>
<script>
'use strict';
// Банк иллюстрированных заданий. Каждый набор содержит 3 объекта с общим признаком
// и один отличающийся. Все изображения собраны в один локальный атлас без интернета.
const BANK = [{"topic":"Еда","level":"easy","rule":"Фрукты","reason":"Огурец не фрукт. Остальные — фрукты.","items":[{"label":"яблоко","pic":0},{"label":"груша","pic":1},{"label":"банан","pic":2},{"label":"огурец","pic":3}]},{"topic":"Еда","level":"easy","rule":"Фрукты","reason":"Морковь не фрукт. Остальные — фрукты.","items":[{"label":"апельсин","pic":4},{"label":"персик","pic":5},{"label":"ананас","pic":6},{"label":"морковь","pic":7}]},{"topic":"Еда","level":"easy","rule":"Овощи","reason":"Виноград не овощ. Остальные — овощи.","items":[{"label":"морковь","pic":7},{"label":"огурец","pic":3},{"label":"брокколи","pic":8},{"label":"виноград","pic":9}]},{"topic":"Еда","level":"easy","rule":"Овощи","reason":"Груша не овощ. Остальные — овощи.","items":[{"label":"картофель","pic":10},{"label":"лук","pic":11},{"label":"перец","pic":12},{"label":"груша","pic":1}]},{"topic":"Еда","level":"easy","rule":"Напитки","reason":"Хлеб не напиток. Остальное можно пить.","items":[{"label":"молоко","pic":13},{"label":"сок","pic":14},{"label":"чай","pic":15},{"label":"хлеб","pic":16}]},{"topic":"Еда","level":"easy","rule":"Сладости","reason":"Суп не сладость. Остальное — сладости.","items":[{"label":"конфета","pic":17},{"label":"печенье","pic":18},{"label":"шоколад","pic":19},{"label":"суп","pic":20}]},{"topic":"Еда","level":"medium","rule":"Выпечка","reason":"Сыр не выпечка. Остальное выпекают из теста.","items":[{"label":"батон","pic":21},{"label":"круассан","pic":22},{"label":"крендель","pic":23},{"label":"сыр","pic":24}]},{"topic":"Еда","level":"medium","rule":"Напитки, которые обычно пьют тёплыми","reason":"Лимонад обычно пьют холодным. Чай, кофе и какао часто пьют тёплыми.","items":[{"label":"чай","pic":15},{"label":"кофе","pic":25},{"label":"какао","pic":26},{"label":"лимонад","pic":27}]},{"topic":"Еда","level":"medium","rule":"Еда из молока","reason":"Макароны не делают из молока. Остальное — молочные продукты.","items":[{"label":"сыр","pic":24},{"label":"сливочное масло","pic":28},{"label":"мороженое","pic":29},{"label":"макароны","pic":30}]},{"topic":"Еда","level":"hard","rule":"Можно есть сырым без приготовления","reason":"Сырую картошку обычно не едят. Остальные продукты можно есть сырыми.","items":[{"label":"яблоко","pic":0},{"label":"огурец","pic":3},{"label":"морковь","pic":7},{"label":"картофель","pic":10}]},{"topic":"Еда","level":"hard","rule":"Едят ложкой","reason":"Хлеб обычно едят руками. Суп, кашу и мороженое в креманке удобно есть ложкой.","items":[{"label":"суп","pic":20},{"label":"каша","pic":31},{"label":"мороженое","pic":32},{"label":"хлеб","pic":16}]},{"topic":"Еда","level":"hard","rule":"Продукты, которые получают от животных","reason":"Морковь растёт на грядке. Молоко, сыр и яйца получают от животных.","items":[{"label":"молоко","pic":13},{"label":"сыр","pic":24},{"label":"яйцо","pic":33},{"label":"морковь","pic":7}]},{"topic":"Еда","level":"hard","rule":"Готовят из теста","reason":"Салат не готовят из теста.","items":[{"label":"блины","pic":34},{"label":"пельмени","pic":35},{"label":"пицца","pic":36},{"label":"салат","pic":37}]},{"topic":"Животные","level":"easy","rule":"Домашние животные","reason":"Лиса — дикое животное. Остальные живут рядом с человеком.","items":[{"label":"кошка","pic":38},{"label":"собака","pic":39},{"label":"корова","pic":40},{"label":"лиса","pic":41}]},{"topic":"Животные","level":"easy","rule":"Птицы","reason":"Кошка не птица. Остальные — птицы.","items":[{"label":"утка","pic":42},{"label":"сова","pic":43},{"label":"попугай","pic":44},{"label":"кошка","pic":38}]},{"topic":"Животные","level":"easy","rule":"Насекомые","reason":"Паук не насекомое. Остальные — насекомые.","items":[{"label":"пчела","pic":45},{"label":"божья коровка","pic":46},{"label":"бабочка","pic":47},{"label":"паук","pic":48}]},{"topic":"Животные","level":"easy","rule":"Рыбы","reason":"Дельфин не рыба. Остальные — рыбы.","items":[{"label":"акула","pic":49},{"label":"рыба-клоун","pic":50},{"label":"карась","pic":51},{"label":"дельфин","pic":52}]},{"topic":"Животные","level":"easy","rule":"Звери","reason":"Крокодил — пресмыкающееся. Остальные — звери.","items":[{"label":"медведь","pic":53},{"label":"лиса","pic":41},{"label":"волк","pic":54},{"label":"крокодил","pic":55}]},{"topic":"Животные","level":"easy","rule":"Насекомые","reason":"Червяк не насекомое. Остальные — насекомые.","items":[{"label":"кузнечик","pic":56},{"label":"муравей","pic":57},{"label":"комар","pic":58},{"label":"червяк","pic":59}]},{"topic":"Животные","level":"medium","rule":"Домашние птицы","reason":"Воробей не домашняя птица.","items":[{"label":"курица","pic":60},{"label":"индюк","pic":61},{"label":"домашняя утка","pic":62},{"label":"воробей","pic":63}]},{"topic":"Животные","level":"medium","rule":"Морские млекопитающие","reason":"Акула — рыба. Кит, дельфин и тюлень — млекопитающие.","items":[{"label":"кит","pic":64},{"label":"дельфин","pic":52},{"label":"тюлень","pic":65},{"label":"акула","pic":49}]},{"topic":"Животные","level":"medium","rule":"Звери, покрытые шерстью","reason":"Черепаха покрыта панцирем, остальные — звери с шерстью.","items":[{"label":"кролик","pic":66},{"label":"белка","pic":67},{"label":"лиса","pic":41},{"label":"черепаха","pic":68}]},{"topic":"Животные","level":"medium","rule":"Птицы, которые могут летать","reason":"Пингвин не летает. Остальные птицы летают.","items":[{"label":"орёл","pic":69},{"label":"сова","pic":43},{"label":"попугай","pic":44},{"label":"пингвин","pic":70}]},{"topic":"Животные","level":"medium","rule":"Живут преимущественно в воде","reason":"Лисица живёт на суше. Остальные живут в воде.","items":[{"label":"дельфин","pic":52},{"label":"рыбка","pic":50},{"label":"осьминог","pic":71},{"label":"лиса","pic":41}]},{"topic":"Животные","level":"medium","rule":"Питаются растениями","reason":"Тигр — хищник. Корова, лошадь и коза питаются растениями.","items":[{"label":"корова","pic":40},{"label":"лошадь","pic":72},{"label":"коза","pic":73},{"label":"тигр","pic":74}]},{"topic":"Животные","le function esc(value){
  return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}
function shuffle(items){
  const result = items.slice();
  for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]];}
  return result;
}
function pool(){return BANK.filter(q => state.cats.has(q.topic) && (state.level==='mix' || q.level===state.level));}
function tone(good){
  if(!state.sound)return;
  try{
    const Context=window.AudioContext||window.webkitAudioContext;
    if(!Context)return;
    if(!tone.ctx)tone.ctx=new Context();
    const ctx=tone.ctx;
    if(ctx.state==='suspended')ctx.resume().catch(()=>{});
    const oscillator=ctx.createOscillator(), gain=ctx.createGain(), t=ctx.currentTime;
    oscillator.type='sine';oscillator.frequency.value=good?660:250;
    gain.gain.setValueAtTime(.055,t);gain.gain.exponentialRampToValueAtTime(.001,t+.16);
    oscillator.connect(gain);gain.connect(ctx.destination);
    oscillator.start(t);oscillator.stop(t+.17);
  }catch(e){}
}

function updateSettings(){
  const available=pool().length;
  $('levels').querySelectorAll('button').forEach(b=>{const on=b.dataset.level===state.level;b.classList.toggle('selected',on);b.setAttribute('aria-pressed',String(on));});

  $('topics').querySelectorAll('input').forEach((input,i)=>input.checked=state.cats.has(CATEGORIES[i]));
  $('start').disabled=available===0;
  const qty=state.rounds===0?available:Math.min(state.rounds,available);
  $('start').textContent=available===0?'Выбери хотя бы одну подходящую тему':`Начать: ${qty} ${plural(qty,['задание','задания','заданий'])}`;
}
function plural(n, forms){return forms[(n%100>=11 && n%100<=14)?2:(n%10===1?0:(n%10>=2&&n%10<=4?1:2))];}
function planQuestions(){
  // Чередуем темы. Ребёнок не получает подряд десять похожих рядов.
  const groups=new Map();
  shuffle(pool()).forEach(q=>{if(!groups.has(q.topic))groups.set(q.topic,[]);groups.get(q.topic).push(q);});
  const planned=[];
  const max=state.rounds===0?pool().length:Math.min(state.rounds,pool().length);
  let lastTopic=null,lastOdd=null;
  while(planned.length<max){
    const choices=shuffle([...groups.entries()].filter(([,list])=>list.length>0));
    if(!choices.length)break;
    const selected=choices.find(([topic,list])=>topic!==lastTopic && list.some(q=>q.items[3].label!==lastOdd)) || choices.find(([topic])=>topic!==lastTopic) || choices[0];
    const [topic,list]=selected;
    const idx=list.findIndex(q=>q.items[3].label!==lastOdd);
    const question=list.splice(idx>=0?idx:0,1)[0];
    planned.push(question);lastTopic=topic;lastOdd=question.items[3].label;
  }
  return planned;
}
function startGame(){
  state.queue=planQuestions();if(!state.queue.length)return showSettings();
  state.index=0;state.stats={independent:0,assisted:0,alternative:0,discuss:0};

}

function choose(index){

      if(state.teacher)$('acceptOther').hidden=false;
    }else{
      state.stats.discuss++;
      buttons[state.current.odd].classList.add('intended');
      status('Посмотри на выделенную картинку. Почему именно она не подходит?', 'retry');
      finalize();
      if(state.teacher)$('acceptOther').hidden=false;
    }
  }
}
function finalize(){
  state.answered=true;
  [...$('cards').children].forEach(b=>b.disabled=true);
  $('nextBtn').disabled=false;
  $('hintBtn').hidden=true;
  $('hintBox').hidden=true;
  $('reasonBtn').hidden=false;
  $('reasonBox').textContent=state.current.question.reason;
  $('acceptOther').hidden=!(state.teacher && state.attempts>0 && state.chosen!==state.current.odd);
}
function acceptOther(){
  if(!state.teacher || state.chosen===null || state.chosen===state.current.odd)return;
  // Альтернативный ответ не приравнивается к найденному самостоятельно
  // задуманному признаку; хранится отдельно в итогах занятия.
  if(state.answered && state.stats.discuss>0)state.stats.discuss--;
  state.stats.alternative++;
  const buttons=[...$('cards').children];
  buttons.forEach(b=>{b.classList.remove('try-again','intended');b.disabled=true;});
  buttons[state.chosen].classList.add('correct');
  status('Другой обоснованный ответ засчитан педагогом. Обсудите оба способа группировки.', 'success');
  state.answered=true;
  $('nextBtn').disabled=false;
  $('hintBtn').hidden=true;
  $('hintBox').hidden=true;
  $('reasonBtn').hidden=false;
  $('reasonBox').textContent=state.current.question.reason;
  $('acceptOther').hidden=true;
}
function showResult(){
  setBack('round');
  const s=state.stats,total=state.queue.length;
  app.innerHTML=`
    <section class="panel result">
      <div class="medal" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="66" height="66" viewBox="0 0 24 24" fill="#F7CA64" stroke="#E39D30" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 3.1 6.4 7.1 1-5.1 5 .9 7.1-6-3.3-6.1 3.3 1.1-7.1-5.2-5 7.2-1Z"/></svg></div>
      <h2>Занятие завершено!</h2>
      <p class="intro">Разобрали ${total} ${plural(total,['задание','задания','заданий'])}.</p>
      <div class="stats">
        <div class="stat"><strong>${s.independent}</strong><span>По задуманному правилу с первой попытки, без подсказки</span></div>
        <div class="stat"><strong>${s.assisted}</strong><span>По задуманному правилу с подсказкой или повторно</span></div>
        <div class="stat"><strong>${s.alternative}</strong><span>Другие объяснения, принятые педагогом</span></div>
        <div class="stat"><strong>${s.discuss}</strong><span>Потребовалось разобрать ответ вместе</span></div>
      </div>
      <p class="result-note">Это результаты одного занятия, а не оценка развития ребёнка. Важно замечать, какие признаки он выделяет и может ли объяснить свой выбор.</p>
      <div class="controls"><button class="primary" id="again">Ещё занятие</button><button class="ghost" id="settingsBtn">Настройки</button></div>
    </section>`;
  $('again').onclick=startGame;
  $('settingsBtn').onclick=showSettings;
}
// Защита банка от опечаток при будущем редактировании.
function validateBank(){
  for(const [i,q] of BANK.entries()){
    if(!q.topic || !['easy','medium','hard'].includes(q.level) || !q.rule || !q.reason || !Array.isArray(q.items) || q.items.length!==4 || q.items.some(it=>!it.label || (typeof it.pic!=='number' && !it.letter) || (typeof it.pic==='number' && (it.pic<0 || it.pic>=267)))){
      throw new Error('Неверный набор «Что лишнее?»: '+(i+1));
    }
  }
}
validateBank();showSettings();
</script>

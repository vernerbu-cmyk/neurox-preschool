name: Build Slogolaz APK and Android Studio Project
on:
  push:
    branches:
      - slogolaz-apk-build-20261120
    paths:
      - 'slogolaz-android/**'
      - '.github/workflows/slogolaz-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate icon assets
        run: |
          python -m pip install cairosvg pillow
          python slogolaz-android/generate_icons.py
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile installable APK
        working-directory: slogolaz-android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp slogolaz-android/app/build/outputs/apk/debug/app-debug.apk dist/Slogolaz-v13.apk
          sha256sum dist/Slogolaz-v13.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Slogolaz-v13-APK
          path: dist/Slogolaz-v13.apk
          if-no-files-found: error
      - name: Generate Gradle Wrapper and complete Android Studio ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd slogolaz-android
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin --no-daemon
          test -s gradlew
          test -s gradlew.bat
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties
          test -s app/src/main/assets/index.html
          test -s app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          grep -q 'versionCode 13' app/build.gradle
          grep -q 'педоф' app/src/main/assets/index.html
          cd ..
          mkdir -p export/Slogolaz-AndroidStudio-v13 dist
          rsync -a \
            --exclude='.gradle/' --exclude='build/' --exclude='.idea/' \
            --exclude='local.properties' --exclude='*.iml' \
            --exclude='__pycache__/' \
            slogolaz-android/ export/Slogolaz-AndroidStudio-v13/
          chmod +x export/Slogolaz-AndroidStudio-v13/gradlew
          (cd export && zip -q -r ../dist/Slogolaz-AndroidStudio-v13.zip Slogolaz-AndroidStudio-v13)
          unzip -t dist/Slogolaz-AndroidStudio-v13.zip | tail -1
          sha256sum dist/Slogolaz-AndroidStudio-v13.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Slogolaz-v13-AndroidStudio-Project
          path: dist/Slogolaz-AndroidStudio-v13.zip
          if-no-files-found: error
      - name: Publish Android Studio project without replacing existing APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload slogolaz-v13-install dist/Slogolaz-AndroidStudio-v13.zip --clobber

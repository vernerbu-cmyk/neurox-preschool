name: Build Slogolaz Android APK
on:
  push:
    branches:
      - slogolaz-apk-build-20261120
    paths:
      - 'slogolaz-android/**'
      - '.github/workflows/slogolaz-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate icon assets
        run: |
          python -m pip install cairosvg pillow
          python slogolaz-android/generate_icons.py
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile installable APK
        working-directory: slogolaz-android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp slogolaz-android/app/build/outputs/apk/debug/app-debug.apk dist/Slogolaz-v13.apk
          sha256sum dist/Slogolaz-v13.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Slogolaz-v13-APK
          path: dist/Slogolaz-v13.apk
          if-no-files-found: error
      - name: Publish APK as GitHub Release asset
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view slogolaz-v13-install >/dev/null 2>&1; then
            gh release upload slogolaz-v13-install dist/Slogolaz-v13.apk --clobber
          else
            gh release create slogolaz-v13-install dist/Slogolaz-v13.apk --target "$GITHUB_SHA" --title "Слоголаз v13 (Android APK)" --notes "Установочный Android APK из Слоголаза v13. Автономная работа без интернета."
          fi
